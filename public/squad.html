<!doctype html>
<html lang="ru" class="squad-page">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1c14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Din8sty" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title data-i18n="squad.title">Мой состав · Din8sty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=PT+Sans+Narrow:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/sw-register.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="nav.skip">К содержимому</a>
    <div class="pitch" aria-hidden="true"></div>
    <header class="top">
      <div>
        <h1 class="brand"><a href="/">Din8sty</a></h1>
        <p class="tag" data-i18n="tag.squad">Мой состав · FPTS за туры</p>
      </div>
      <nav class="main-nav" aria-label="Разделы" data-i18n-aria="nav.aria">
        <a href="/players" data-i18n="nav.players">Футболисты</a>
        <a href="/schedule.html" data-i18n="nav.schedule">Расписание</a>
        <a href="/top4.html" data-i18n="nav.top4">Топ-4 катка</a>
        <a href="/top4/rules" data-i18n="nav.rules">Правила</a>
        <a href="/squad.html" aria-current="page" data-i18n="nav.mySquad">Мой состав</a>
        <a href="/lineup.html?league=top4" data-i18n="nav.lineup">Выставить состав</a>
      </nav>
      <div id="lang-switcher-host" class="lang-switcher-host"></div>
      <div id="auth-bar" class="auth-bar"></div>
    </header>

    <main id="main" tabindex="-1">
    <p class="meta" id="meta" data-i18n="common.loading">Загрузка…</p>
    <div id="app" class="squad-app" hidden></div>
    </main>

    <div id="fpts-breakdown-overlay" class="lottery-overlay confirm-overlay" hidden>
      <div class="lottery-card fpts-bd-card" role="dialog" aria-modal="true" aria-labelledby="fpts-bd-name">
        <div class="fpts-bd-head">
          <div class="fpts-bd-who">
            <h3 class="subhead" id="fpts-bd-name"></h3>
            <p class="muted fpts-bd-club" id="fpts-bd-club"></p>
          </div>
          <button type="button" class="auth-link fpts-bd-close" id="fpts-bd-close" data-i18n-aria="common.close" aria-label="Закрыть">×</button>
        </div>
        <div class="fpts-bd-body" id="fpts-bd-body"></div>
        <p class="fpts-bd-total">
          <span id="fpts-bd-total-label"></span>
          <span class="mono" id="fpts-bd-total"></span>
        </p>
      </div>
    </div>

    <script src="/i18n.js"></script>
    <script src="/auth.js"></script>
    <script src="/squad.js"></script>
  </body>
</html>
